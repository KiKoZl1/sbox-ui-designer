title: SUI Designer
description: >-
  Visual UI editor for s&box — design .sui asset files in a paint-based canvas,
  generate idiomatic Razor + SCSS, preview live in Test in Play mode.
remote_theme: just-the-docs/just-the-docs
url: https://kikozl1.github.io
baseurl: /sbox-ui-designer

# Search
search_enabled: true
search:
  heading_level: 6
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

heading_anchors: true
permalink: pretty

# Theme — dark-first with SUI green accent (#4ade80)
color_scheme: sui_dark

# Copy-to-clipboard buttons on code blocks
enable_copy_code_button: true

# Mermaid diagrams (just-the-docs config key)
mermaid:
  version: "10.9.0"

nav_external_links:
  - title: GitHub Repository
    url: https://github.com/KiKoZl1/sbox-ui-designer
    hide_icon: false
  - title: Open ISSUES.md
    url: https://github.com/KiKoZl1/sbox-ui-designer/blob/main/ISSUES.md
    hide_icon: false

# Callouts — used via {: .tip } / {: .warning } etc. on blockquotes
callouts_level: quiet
callouts:
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: yellow
  info:
    title: Info
    color: blue
  new:
    title: New
    color: purple
  note:
    title: Note
    color: grey-dk

footer_content: >-
  SUI Designer · MIT license · Built for the s&box ecosystem.

# Exclude internal planning docs from the published site
exclude:
  - prd/
  - "M1_PROJECT_INSPECTION.md"
