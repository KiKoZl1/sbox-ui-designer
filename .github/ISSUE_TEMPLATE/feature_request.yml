name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the **problem** first, then your
        proposed solution. Often the best design becomes clear only after the
        problem is well-understood.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the situation where you'd want this feature. What are you
        trying to accomplish, and what's hard or impossible today?
      placeholder: |
        I want to design a UI with [...] but currently I have to [...] which is
        slow / error-prone / impossible because [...].
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: |
        What you'd like the addon to do. Sketch UI if it helps — ASCII or images.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other designs you weighed.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: How big do you think this is?
      options:
        - Small (a new field in Details, a hotkey, a polish item)
        - Medium (a new element type, a new workflow tool)
        - Large (a new tab, animations system, bindings)
        - I don't know
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples from other tools (optional)
      description: |
        Has Unity / Figma / UMG / another tool solved this in a way you like?
        Link or screenshot welcome.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
